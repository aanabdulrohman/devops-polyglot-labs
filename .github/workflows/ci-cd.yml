name: DevOps Polyglot CI/CD Pipeline

on:
  push:
    tags:
      - '*.*.*'

jobs:
  security-and-build:
    runs-on: self-hosted
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    # Build and Scan Go Notes Image
    - name: Build Go Notes Image
      run: |
        docker build -t ${{  secrets.DOCKERHUB_USERNAME }}/go-notes:{github.ref_name} ./go-notes
    
    - name: Run Trivy Vurnerability Scan for Go Notes
      run: |
        trivy image ${{  secrets.DOCKERHUB_USERNAME }}/go-notes:{github.ref_name}

    # Build and Scan Python Calc Image
    - name: Build Python Calc Image
      run: |
        docker build -t ${{  secrets.DOCKERHUB_USERNAME }}/python-calc:{github.ref_name} ./python-calc

    - name: Run Trivy Vulnerability Scan for Python Calc
      run: |
        trivy image ${{  secrets.DOCKERHUB_USERNAME }}/python-calc:{github.ref_name}

    # Build and Scan Node Todo Image
    - name: Build Node Todo Image
      run: |
        docker build -t ${{  secrets.DOCKERHUB_USERNAME }}/node-todo:{github.ref_name} ./node-todo
  
    - name: Run Trivy Vulnerability Scan for Node Todo
      run: |
        trivy image ${{  secrets.DOCKERHUB_USERNAME }}/node-todo:{github.ref_name}

    - name: Push Images to DockerHub
      run: |
        docker push ${{  secrets.DOCKERHUB_USERNAME }}/go-notes:{github.ref_name}
        docker push ${{  secrets.DOCKERHUB_USERNAME }}/python-calc:{github.ref_name}
        docker push ${{  secrets.DOCKERHUB_USERNAME }}/node-todo:{github.ref_name}
    
    - name: Deploy to Docker Swarm
      run: |
        docker stack deploy -c docker-stack.yml devops-polyglot-lab

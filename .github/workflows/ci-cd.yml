name: DevOps Polyglot CI/CD Pipeline

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: read

jobs:
  security-and-build:
    runs-on: self-hosted

    env:
      IMAGE_TAG: ${{ github.ref_name }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ==========================================
      # 1. BUILD & SCAN: Go Notes
      # ==========================================
      - name: Build Go Notes Image
        run: |
          docker build \
            -t "$DOCKERHUB_USERNAME/go-notes:$IMAGE_TAG" \
            ./go-notes

      - name: Scan Go Notes Image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v $HOME/.cache/trivy:/root/.cache/ \
            aquasec/trivy:latest image --exit-code 1 --severity HIGH,CRITICAL \
            "$DOCKERHUB_USERNAME/go-notes:$IMAGE_TAG"

      # ==========================================
      # 2. BUILD & SCAN: Python Calc
      # ==========================================
      - name: Build Python Calc Image
        run: |
          docker build \
            -t "$DOCKERHUB_USERNAME/python-calc:$IMAGE_TAG" \
            ./python-calc

      - name: Scan Python Calc Image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v $HOME/.cache/trivy:/root/.cache/ \
            aquasec/trivy:latest image --exit-code 1 --severity HIGH,CRITICAL \
            "$DOCKERHUB_USERNAME/python-calc:$IMAGE_TAG"

      # ==========================================
      # 3. BUILD & SCAN: Node Todo
      # ==========================================
      - name: Build Node Todo Image
        run: |
          docker build \
            -t "$DOCKERHUB_USERNAME/node-todo:$IMAGE_TAG" \
            ./node-todo

      - name: Scan Node Todo Image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v $HOME/.cache/trivy:/root/.cache/ \
            aquasec/trivy:latest image --exit-code 1 --severity HIGH,CRITICAL \
            "$DOCKERHUB_USERNAME/node-todo:$IMAGE_TAG"

      # ==========================================
      # 4. PUSH & DEPLOY
      # ==========================================
      - name: Push Images to DockerHub
        run: |
          docker push "$DOCKERHUB_USERNAME/go-notes:$IMAGE_TAG"
          docker push "$DOCKERHUB_USERNAME/python-calc:$IMAGE_TAG"
          docker push "$DOCKERHUB_USERNAME/node-todo:$IMAGE_TAG"

      - name: Deploy to Docker Swarm
        run: |
          docker stack deploy \
            --with-registry-auth \
            -c docker-stack.yml \
            devops-polyglot-lab
